<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="120" fill="none">
  <defs>
    <!-- British Racing Green & MOT Test Station theme gradient -->
    <linearGradient id="motBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011b15"/>
    </linearGradient>

    <!-- MOT Triple Triangle Blue gradient -->
    <linearGradient id="motTriangles" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#022c22" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- MOT Inspection Shield Badge Tile -->
  <g transform="translate(15, 20)" filter="url(#tileShadow)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#motBadge)" stroke="#059669" stroke-width="1.5"/>

    <!-- MOT Triangles Emblem (Official UK MOT station style) -->
    <g transform="translate(18, 18)">
      <!-- Top Triangle -->
      <polygon points="22,6 31,21 13,21" fill="#ffffff" />
      <!-- Bottom Left Triangle -->
      <polygon points="12,23 21,38 3,38" fill="#ffffff" />
      <!-- Bottom Right Triangle -->
      <polygon points="32,23 41,38 23,38" fill="#ffffff" />

      <!-- Inspection Verified Check Badge -->
      <circle cx="34" cy="11" r="5.5" fill="#10b981" />
      <path d="M 32 11 L 33.5 12.5 L 36.5 9.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Typography: 'MOTPing' using SF Pro Display style font stack -->
  <g transform="translate(112, 74)">
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="-1.2" 
          fill="#0f172a">
      MOT<tspan fill="#059669">Ping</tspan>
    </text>

    <!-- Red Alert Beacon directly above the last 'g' in MOTPing -->
    <!-- 'MOT' ~ 95px, 'Pin' ~ 72px, 'g' center around 188px, top around -35px -->
    <circle cx="188" cy="-35" r="5" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="188" cy="-35" r="4.5" fill="#dc2626"/>
    <circle cx="186.5" cy="-36.5" r="1.5" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
