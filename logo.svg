<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="90" fill="none">
  <!-- Crisp, flat MOT Three-Triangle test station emblem in official DVSA cobalt blue -->
  <g transform="translate(10, 16)">
    <!-- Base plate -->
    <rect x="0" y="0" width="58" height="58" rx="8" fill="#004380" stroke="#005ea5" stroke-width="1"/>
    <!-- The official three triangles layout -->
    <polygon points="29,12 39,28 19,28" fill="#ffffff" />
    <polygon points="18,31 28,47 8,47" fill="#ffffff" />
    <polygon points="40,31 50,47 30,47" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(82, 54)">
    <text x="0" y="0" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="30" 
          font-weight="700" 
          letter-spacing="-0.8" 
          fill="#ffffff">
      MOT<tspan fill="#38bdf8">Ping</tspan>
    </text>
    <text x="135" y="-3"
          font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="10"
          font-weight="600"
          letter-spacing="1.2"
          fill="#71717a">
      DVLA TELEMETRY
    </text>
  </g>
</svg>
