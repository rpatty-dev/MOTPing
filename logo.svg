<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="90" fill="none">
  <!-- Prominent MOT Three-Triangle test station emblem in official DVSA cobalt blue -->
  <g transform="translate(6, 10)">
    <!-- Base plate - made bigger (70x70) -->
    <rect x="0" y="0" width="70" height="70" rx="10" fill="#004380" stroke="#005ea5" stroke-width="1.5"/>
    <!-- The official three triangles layout scaled up and centered -->
    <polygon points="35,13 48,34 22,34" fill="#ffffff" />
    <polygon points="21,37 34,58 8,58" fill="#ffffff" />
    <polygon points="49,37 62,58 36,58" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(94, 52)">
    <text x="0" y="0" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="31" 
          font-weight="700" 
          letter-spacing="-0.8" 
          fill="#ffffff">
      MOT<tspan fill="#38bdf8">Ping</tspan>
    </text>
    <text x="136" y="-3"
          font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="10.5"
          font-weight="600"
          letter-spacing="1.5"
          fill="#a1a1aa">
      FLEET DVLA TELEMETRY
    </text>
  </g>
</svg>
